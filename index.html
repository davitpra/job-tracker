<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker de aplicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: header with actions, tab bar, one working view at a time; tables and charts read top-down, summary first. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#18202b; --muted:#5d6878; --line:#dfe3ea;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --warm:#c46a12;
  --ok:#1d7a4f; --ok-soft:#dff2e8; --warn:#9a6a00; --warn-soft:#fbf0d4; --bad:#b3342d; --bad-soft:#f8e1df;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --surface:#191f27; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2b333e;
    --accent:#7aa8ef; --accent-soft:#1d2a3e; --warm:#e59a4a;
    --ok:#5cc495; --ok-soft:#173226; --warn:#e2b551; --warn-soft:#352b12; --bad:#ef8079; --bad-soft:#3a1e1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#191f27; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2b333e;
  --accent:#7aa8ef; --accent-soft:#1d2a3e; --warm:#e59a4a;
  --ok:#5cc495; --ok-soft:#173226; --warn:#e2b551; --warn-soft:#352b12; --bad:#ef8079; --bad-soft:#3a1e1c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 30px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 20px/1.2 var(--display);margin:0 0 10px;text-wrap:balance}
h3{font:600 15px/1.3 var(--body);margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1726}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1726}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px}
.notice.info{border-left-color:var(--accent)}
.notice ul{margin:6px 0 0;padding-left:18px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
h2.sect{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 -6px;font-family:var(--body)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .d{font-size:13px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:180px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{width:100%;min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums}
/* Barra de estado: control segmentado con punto de color por estado y conteo en badge. */
.segbar{display:flex;align-items:center;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.segbar .seg-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:0 8px 0 4px}
.segbar .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 5px;flex:none}
.seg{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 9px;font-size:13px;font-weight:500;line-height:1.2;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg:hover{background:var(--accent-soft);color:var(--ink)}
.seg .dot{width:7px;height:7px;border-radius:50%;background:var(--dot,currentColor);flex:none}
.seg .n{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:3px 6px;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg[aria-pressed="true"] .dot{--dot:currentColor}
.seg[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:inherit}
:root[data-theme="dark"] .seg[aria-pressed="true"]{color:#0d1726}
:root[data-theme="dark"] .seg[aria-pressed="true"] .n{background:rgba(13,23,38,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg[aria-pressed="true"]{color:#0d1726}:root:not([data-theme="light"]) .seg[aria-pressed="true"] .n{background:rgba(13,23,38,.18)}}
@media (max-width:640px){.segbar{flex-wrap:nowrap;overflow-x:auto}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pipe-wrap{display:flex;flex-direction:column;gap:8px}
.pstripe{display:flex;gap:2px;height:22px;border-radius:8px;overflow:hidden}
.pseg{border:0;padding:0 8px;min-width:6px;cursor:pointer;background:var(--c);color:#fff;font:600 11px/22px var(--body);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s}
.pseg span{text-shadow:0 1px 1px rgba(0,0,0,.25)}
.pseg:hover{filter:brightness(1.08)}
.pstripe.has-sel .pseg:not([aria-pressed="true"]){opacity:.35}
:root[data-theme="dark"] .pseg{color:#0d1726}
:root[data-theme="dark"] .pseg span{text-shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pseg{color:#0d1726}:root:not([data-theme="light"]) .pseg span{text-shadow:none}}
.pipe{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pphase{display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
.pph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 14px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pph b{font:600 12px var(--mono);letter-spacing:0;color:var(--ink);background:var(--bg);border-radius:999px;padding:2px 8px}
.pcells{display:flex;flex:1;padding:4px 6px 6px;gap:4px}
.pcell{flex:1 1 0;min-width:96px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px 10px;cursor:pointer;color:var(--ink);font:inherit;transition:background .15s,border-color .15s}
.pcell:hover{background:var(--bg)}
.pcell[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.pnum{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.pnum small{font:500 11px var(--mono);color:var(--muted)}
.plbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcell[aria-pressed="true"] .plbl{color:var(--ink);font-weight:600}
.plbl .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pmeter{display:flex;height:4px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:4px;gap:1px}
.pmeter i{display:block;height:100%;background:var(--c);border-radius:999px}
.pmeter.all i{border-radius:0}
.pall{flex:0 0 140px;margin:6px;justify-content:center}
.pall .pnum{font-size:32px}
.pnone{font-size:13px;color:var(--muted);padding:12px 10px}
@media (max-width:760px){.pipe{flex-wrap:wrap}.pall{flex:1 1 100%;margin:6px 6px 0}.pphase{flex:1 1 100%!important;border-left:0;border-top:1px solid var(--line)}}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.co{font-weight:600}
.role{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line);color:var(--ink)}
.s-por{background:var(--accent-soft);color:var(--accent)}
.s-eval{background:var(--warn-soft);color:var(--warn)}
.s-apl{background:var(--accent-soft);color:var(--ink)}
.s-int{background:var(--ok-soft);color:var(--ok)}
.s-of{background:var(--ok);color:#fff}
.s-rech{background:var(--bad-soft);color:var(--bad)}
.s-sin{background:var(--line);color:var(--muted)}
.s-desc{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.prio{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font:600 12px var(--mono);border:1px solid var(--line)}
.prio.p1{background:var(--warm);color:#fff;border-color:var(--warm)}
.prio.p2{border-color:var(--warm);color:var(--warm)}
.sig{font-size:12px;color:var(--ok);font-weight:600}
.next{font-size:13px;max-width:280px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--bg);color:var(--ink);width:min(980px,96vw);max-height:92vh}
.dlg-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dsec>h3,.dsec>summary{font:600 13px/1.3 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.dsec>summary{cursor:pointer;margin:0;list-style:revert}
.dsec[open]>summary{margin-bottom:10px}
.dsec .cnt{font:500 12px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dsec .form{grid-template-columns:repeat(4,minmax(0,1fr))}
.dsec .form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dsec .form.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dsec .form.c1{grid-template-columns:1fr}
.form label.s2{grid-column:span 2}
.dsub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.dsub summary{cursor:pointer;font-size:13px;font-weight:600}
@media (max-width:760px){.dcols{grid-template-columns:1fr}.dsec .form,.dsec .form.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.dsec .form,.dsec .form.c3,.dsec .form.c2{grid-template-columns:1fr}.form label.s2{grid-column:auto}}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{font-size:14px;color:var(--ink);font-weight:400}
.req{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;font-size:14px}
.diff .h{font-weight:600;margin-top:8px}
.diff .m{color:var(--bad);text-decoration:line-through}
.diff .p{color:var(--ok)}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar-track{height:12px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.bar-fill.alt{background:var(--warm)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--body)}
.md h1,.md h2{font-family:var(--display)}
.md h1{font-size:22px}.md h2{font-size:17px;margin-top:18px}
.md p,.md li{max-width:78ch}
.status{font-size:13px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:640px){ h1{font-size:24px} .next{max-width:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Tracker de aplicaciones</h1>
      <div class="sub" id="subline">Búsqueda tech de David Prado · cargando datos…</div>
    </div>
    <div class="actions">
      <a class="btn" href="https://github.com/davitpra/cv-toolkit/blob/main/master-cv.md" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">CV maestro</a>
      <button class="btn primary" id="btnNew" type="button">Nueva oferta</button>
      <button class="btn" id="btnJson" type="button">Exportar JSON</button>
      <button class="btn" id="btnCsv" type="button">Exportar CSV</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" aria-label="Secciones">
    <a href="#aplicaciones" data-view="aplicaciones">Aplicaciones</a>
    <a href="#metricas" data-view="metricas">Métricas</a>
    <a href="#tecnologias" data-view="tecnologias">Tecnologías y puestos</a>
    <a href="#descartes" data-view="descartes">Descartes</a>
    <a href="#busquedas" data-view="busquedas">Búsquedas</a>
    <a href="#rubrica" data-view="rubrica">Rúbrica</a>
  </nav>
  <main id="view"><div class="empty">Cargando el tracker…</div></main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="dlgForm">
    <div class="dlg-head">
      <div><h2 id="dlgTitle" style="margin:0">Oferta</h2><div class="sub" id="dlgSub"></div></div>
      <button class="btn" type="button" id="dlgClose">Cerrar</button>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <div><button class="btn danger" type="button" id="dlgDelete">Eliminar</button></div>
      <div class="actions"><span class="status" id="dlgStatus"></span><button class="btn primary" type="submit" id="dlgSave">Guardar</button></div>
    </div>
  </form>
</dialog>

<script>
"use strict";
const ESTADOS=["Por aplicar","Evaluar","Aplicado","Entrevista recruiter","Entrevista técnica","Entrevista final","Oferta","Rechazado","Sin respuesta","Descartada"];
const ORDEN_ESTADO={"Entrevista final":0,"Entrevista técnica":1,"Entrevista recruiter":2,"Oferta":0,"Por aplicar":3,"Evaluar":4,"Aplicado":5,"Sin respuesta":6,"Rechazado":7,"Descartada":8};
const ENCAJES=["Muy alto","Alto","Medio","Bajo"];
const SENALES=["","Vista en LinkedIn","CV descargado","Respondió"];
const MOTIVOS=["Senior o 5+ años","Híbrido o presencial","Modalidad no indicada","200+ solicitantes","Python como núcleo","Otro stack como núcleo","Java/Kotlin, .NET o C#","Móvil nativo","Otra brecha técnica","Rol distinto o por debajo del nivel","Salario bajo","Autorización o residencia","Francés","Duplicada o ya aplicaste en la empresa","Falta información","Oferta cerrada","Otro"];
const APLICADAS=new Set(["Aplicado","Entrevista recruiter","Entrevista técnica","Entrevista final","Oferta","Rechazado","Sin respuesta"]);
const S={apps:[],busq:[],runs:[],rubrica:null,loaded:false,error:null,f:{q:"",estado:"Todas",encaje:"",tipo:"",sort:"prio"},techView:"aplicadas",ritmoDias:30};
let DB=null, DL=null;

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=d=>{if(!d)return"";const [y,m,dd]=String(d).slice(0,10).split("-");const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return `${+dd} ${M[+m-1]}${y!=="2026"?" "+y:""}`};
const pct=(a,b)=>b?Math.round(a*100/b):0;
function estadoColor(e){return {"Por aplicar":"var(--warm)","Evaluar":"var(--warn)","Aplicado":"var(--accent)","Entrevista recruiter":"var(--ok)","Entrevista técnica":"var(--ok)","Entrevista final":"var(--ok)","Oferta":"var(--ok)","Rechazado":"var(--bad)","Sin respuesta":"var(--muted)","Descartada":"var(--line)"}[e]||""}
function estadoCls(e){return {"Por aplicar":"s-por","Evaluar":"s-eval","Aplicado":"s-apl","Rechazado":"s-rech","Sin respuesta":"s-sin","Descartada":"s-desc","Oferta":"s-of"}[e]||(String(e).startsWith("Entrevista")?"s-int":"")}
const isSenior=a=>/\b(senior|sr\.?|staff|lead|founding|principal)\b/i.test(a.puesto||"")||a.nivel==="Senior";
const revisada=a=>!!a.senal||/^Entrevista|Oferta/.test(a.estado||"");
const encRank=a=>{const i=ENCAJES.indexOf(a.encaje);return i<0?9:i};
const conContacto=a=>!!(a.contacto&&String(a.contacto).trim());
const pendienteWeb=a=>a.estado==="Aplicado"&&/^Aplicar en la web de la empresa/i.test(a.proximoPaso||"")&&["Alto","Muy alto"].includes(a.encaje);

/* ---------- data ---------- */
async function init(){
  try{ DL=await claude.use("downloads"); }catch(e){ DL=null; }
  if(!DL){ $("#btnJson").hidden=true; $("#btnCsv").hidden=true; }
  try{ DB=await claude.use("db"); }catch(e){ DB=null; }
  if(!DB){ S.error="No se pudo abrir la base de datos en esta vista. Abre el tracker desde claude.ai con tu cuenta."; render(); return; }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.error="La base todavía no responde. Puede ser la conexión; los datos aparecerán solos cuando llegue."; render(); } },10000);
  const onErr=e=>{ clearTimeout(timer); S.error="Error al leer la base ("+(e&&e.code)+")."; render(); };
  DB.collection("applications").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.error=null; }
    S.apps=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; render();
  },onErr);
  DB.collection("busquedas").onSnapshot(s=>{S.busq=s.docs.map(d=>({id:d.id,...d.data()})); if(S.view==="busquedas")render();},()=>{});
  DB.collection("runs").onSnapshot(s=>{S.runs=s.docs.map(d=>({id:d.id,...d.data()})); if(S.view==="busquedas")render();},()=>{});

/* ---------- Aplicaciones ---------- */
function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let r=S.apps.filter(a=>{
    if(f.estado!=="Todas"&&a.estado!==f.estado)return false;
    if(f.encaje&&(a.encaje||"Sin dato")!==f.encaje)return false;
    if(f.tipo&&a.tipo!==f.tipo)return false;
    if(q&&!`${a.empresa} ${a.puesto} ${a.stack||""} ${a.contacto||""} ${a.notas||""}`.toLowerCase().includes(q))return false;
    return true;});
  const by={prio:(a,b)=>(ORDEN_ESTADO[a.estado]??9)-(ORDEN_ESTADO[b.estado]??9)||(a.prioridad??5)-(b.prioridad??5)||encRank(a)-encRank(b)||String(b.fechaAplicacion||"").localeCompare(String(a.fechaAplicacion||"")),
    fecha:(a,b)=>String(b.fechaAplicacion||b.createdAt||"").localeCompare(String(a.fechaAplicacion||a.createdAt||"")),
    empresa:(a,b)=>String(a.empresa).localeCompare(String(b.empresa)),
    n:(a,b)=>(b.n||0)-(a.n||0)}[f.sort];
  return r.sort(by);
}

function donut(part,total,label){

  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}: ${part} de ${total}">
   <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="16"/>
   <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 70 70)" stroke-linecap="butt"/>

function weekKey(d){const x=new Date(d+"T12:00:00");const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function columns(data,{h=170,keys,colors,labels}){
  // data: [{x, values:{k:n}}]
  const W=Math.max(320,data.length*58), pad=28, maxV=Math.max(1,...data.map(d=>keys.reduce((s,k)=>s+(d.values[k]||0),0)));
  const bw=Math.min(36,(W-pad*2)/data.length-10), step=(W-pad*2)/Math.max(1,data.length);
  const ticks=[0,Math.ceil(maxV/2),maxV];
  let g=ticks.map(t=>{const y=h-20-(t/maxV)*(h-40);return `<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" text-anchor="end">${t}</text>`}).join("");
  data.forEach((d,i)=>{let y=h-20; const x=pad+i*step+(step-bw)/2; let tot=0;
    keys.forEach((k,ki)=>{const v=d.values[k]||0; if(!v)return; tot+=v; const hh=(v/maxV)*(h-40); y-=hh; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${hh}" rx="3" fill="${colors[ki]}"><title>${esc(labels[ki])}: ${v}</title></rect>`;});

/* ---------- Métricas ---------- */
function corte(rows,fn,orden){
  const g={}; rows.forEach(a=>{const k=fn(a); (g[k]=g[k]||[]).push(a)});
  const keys=orden?orden.filter(k=>g[k]):Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  return `<table><thead><tr><th></th><th class="num">Aplicadas</th><th class="num">Revisadas</th><th class="num">%</th><th class="num">Entrevistas</th><th class="num">Rechazos</th></tr></thead><tbody>${keys.map(k=>{const r=g[k];const rv=r.filter(revisada).length;
   return `<tr style="cursor:default"><td>${esc(k)}</td><td class="num">${r.length}</td><td class="num">${rv}</td><td class="num"><b>${pct(rv,r.length)} %</b></td><td class="num">${r.filter(a=>/^Entrevista|Oferta/.test(a.estado)).length}</td><td class="num">${r.filter(a=>a.estado==="Rechazado").length}</td></tr>`}).join("")}</tbody></table>`;
}
/* ---------- Ritmo (por día y por semana) ---------- */
const isoL=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addD=(iso,n)=>{const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()+n);return isoL(x)};
const dow=iso=>(new Date(iso+"T12:00:00").getDay()+6)%7; // 0 = lunes
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const aprox=a=>/aplicaci[oó]n aproximada/i.test(a.notas||"");
function dayChart(data,{h=190,avg=0}){
  const n=data.length, pad=30, W=Math.max(1000,n*20+pad+8), step=(W-pad-8)/n, bw=Math.max(6,Math.min(26,step-6));
  const maxV=Math.max(1,...data.map(d=>d.p+d.c)), y=v=>h-22-(v/maxV)*(h-46);
  const lblEvery=n<=14?1:n<=31?2:7;
  let g=[0,Math.ceil(maxV/2),maxV].filter((t,i,a)=>a.indexOf(t)===i).map(t=>`<line x1="${pad}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("");
  data.forEach((d,i)=>{const x=pad+i*step+(step-bw)/2, tot=d.p+d.c, wk=dow(d.iso)>4;
    if(wk) g+=`<rect x="${pad+i*step}" y="16" width="${step}" height="${h-38}" fill="var(--bg)"/>`;
    let yy=h-22;
    [["p","var(--accent)","Permanente"],["c","var(--warm)","Contrato"]].forEach(([k,col,lb])=>{const v=d[k]; if(!v)return; const hh=(v/maxV)*(h-46); yy-=hh; g+=`<rect x="${x}" y="${yy}" width="${bw}" height="${hh}" rx="2" fill="${col}"><title>${DIAS[dow(d.iso)]} ${fmtD(d.iso)} · ${lb}: ${v}</title></rect>`;});
    if(tot) g+=`<text x="${x+bw/2}" y="${yy-4}" text-anchor="middle" style="fill:var(--ink)">${tot}</text>`;
    if(d.today) g+=`<rect x="${pad+i*step+1}" y="16" width="${step-2}" height="${h-38}" fill="none" stroke="var(--accent)" stroke-dasharray="3 3" rx="4"/>`;
    if(i%lblEvery===0||d.today) g+=`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle" ${d.today?'style="fill:var(--ink);font-weight:600"':""}>${d.today?"hoy":(n<=14?DIAS[dow(d.iso)].slice(0,2)+" ":"")+(+d.iso.slice(8))}</text>`;});
  if(avg>0) g+=`<line x1="${pad}" x2="${W-6}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" width="100%" style="min-width:${Math.round(W*.62)}px;display:block" role="img" aria-label="Aplicaciones por día">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Permanente</span><span><i style="background:var(--warm)"></i>Contrato</span><span><i style="background:var(--bg);border:1px solid var(--line)"></i>Fin de semana</span>${avg>0?`<span><i style="background:none;border-top:2px dashed var(--ok);height:0;border-radius:0"></i>Promedio ${avg.toFixed(1)} por día hábil</span>`:""}</div>`;
}
function ritmo(apl){
  const hoy=isoL(new Date()), lunes=weekKey(hoy);
  const fe=apl.filter(a=>a.fechaAplicacion).map(a=>({a,d:String(a.fechaAplicacion).slice(0,10)}));
  const byDay={}; fe.forEach(({a,d})=>{(byDay[d]=byDay[d]||{p:0,c:0,ap:0}); a.tipo==="Contrato"?byDay[d].c++:byDay[d].p++; if(aprox(a))byDay[d].ap++;});
  const cnt=d=>byDay[d]?byDay[d].p+byDay[d].c:0;
  const sumR=(from,to)=>{let s=0;for(let d=from;d<=to;d=addD(d,1))s+=cnt(d);return s};
  // tiles
  const ayer=addD(hoy,-1), hoyN=cnt(hoy), semN=sumR(lunes,hoy);
  const lunPas=addD(lunes,-7), semPasN=sumR(lunPas,addD(lunes,-1)), semPasAltura=sumR(lunPas,addD(hoy,-7));
  const desde28=addD(hoy,-27); let hab28=0,act28=0; for(let d=desde28;d<=hoy;d=addD(d,1)){if(dow(d)<5)hab28++; if(cnt(d))act28++;}
  const tot28=sumR(desde28,hoy), avgDia=hab28?tot28/hab28:0;
  const semanas={}; fe.forEach(({a,d})=>{const w=weekKey(d);(semanas[w]=semanas[w]||[]).push(a)});
  const prim=Object.keys(semanas).sort()[0];
  const wkList=[]; if(prim) for(let w=prim;w<=lunes;w=addD(w,7)) wkList.push(w);
  const completas=wkList.filter(w=>w<lunes).slice(-4), avgSem=completas.length?completas.reduce((s,w)=>s+(semanas[w]||[]).length,0)/completas.length:0;
  const mejor=wkList.reduce((m,w)=>(semanas[w]||[]).length>((semanas[m]||[]).length)?w:m,wkList[0]);
  let racha=0, d=cnt(hoy)?hoy:addD(hoy,-1); for(let k=0;k<400;k++){ if(dow(d)>4){d=addD(d,-1);continue} if(!cnt(d))break; racha++; d=addD(d,-1); }
  // daily range
  const N=S.ritmoDias||30, desde=addD(hoy,-(N-1)), dias=[]; let habN=0,totN=0;
  for(let x=desde;x<=hoy;x=addD(x,1)){const b=byDay[x]||{p:0,c:0}; dias.push({iso:x,p:b.p,c:b.c,today:x===hoy}); if(dow(x)<5)habN++; totN+=b.p+b.c;}
  const apN=dias.reduce((s,x)=>s+((byDay[x.iso]||{}).ap||0),0);
  // weekly chart + table
  const wkData=wkList.slice(-12).map(w=>{const r=semanas[w]||[];return {x:fmtD(w),values:{p:r.filter(a=>a.tipo!=="Contrato").length,c:r.filter(a=>a.tipo==="Contrato").length}}});
  const filas=wkList.slice().reverse().slice(0,8).map(w=>{const r=semanas[w]||[]; let act=0; for(let i=0;i<7;i++) if(cnt(addD(w,i)))act++; const rv=r.filter(revisada).length;
    return `<tr style="cursor:default"><td style="white-space:nowrap">${fmtD(w)} – ${fmtD(addD(w,6))}${w===lunes?' <span class="pill s-por">en curso</span>':""}</td><td class="num"><b>${r.length}</b></td><td class="num">${act}</td><td class="num">${act?(r.length/act).toFixed(1):"–"}</td><td class="num">${r.length?pct(rv,r.length)+" %":"–"}</td></tr>`}).join("");
  const porDow=DIAS.map((k,i)=>[k,fe.filter(x=>dow(x.d)===i).length]);
  const apTot=fe.filter(x=>aprox(x.a)).length, sinFecha=apl.length-fe.length;
  const tile=(k,v,dd)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${dd}</div></div>`;
  return {
    tiles:`<div class="grid g5">
      ${tile("Hoy",hoyN,`ayer ${cnt(ayer)}`)}
      ${tile("Esta semana",semN,`semana pasada a esta altura: ${semPasAltura} · total ${semPasN}`)}
      ${tile("Por día hábil",avgDia.toFixed(1),`últimas 4 semanas · ${act28} días activos de ${hab28} hábiles`)}
      ${tile("Por semana",avgSem.toFixed(1),`promedio de las últimas ${completas.length||0} semanas cerradas${mejor?` · mejor: ${(semanas[mejor]||[]).length} (${fmtD(mejor)})`:""}`)}
      ${tile("Racha",racha,`${racha===1?"día hábil seguido":"días hábiles seguidos"} con al menos una aplicación`)}
    </div>`,
    diario:`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2>Ritmo por día</h2>
      <div class="chips" role="group" aria-label="Rango">${[14,30,60].map(k=>`<button class="chip" data-rd="${k}" aria-pressed="${N===k}">${k} días</button>`).join("")}</div></div>
      <p class="small muted" style="margin-top:-4px">${totN} aplicaciones en ${N} días · ${dias.filter(x=>x.p+x.c).length} días activos · ${habN?(totN/habN).toFixed(1):"0"} por día hábil.</p>
      ${dayChart(dias,{avg:habN?totN/habN:0})}
      ${apN?`<div class="small muted" style="margin-top:6px">${apN} de estas fechas son aproximadas (reconstruidas el 18 nov), por eso algunas se agrupan en un solo día.</div>`:""}</div>`,
    semanal:`<div class="grid g2">
      <div class="panel"><h2>Ritmo por semana</h2>${wkData.length?columns(wkData,{keys:["p","c"],colors:["var(--accent)","var(--warm)"],labels:["Permanente","Contrato"]}):'<div class="muted small">Sin fechas todavía.</div>'}${sinFecha?`<div class="small muted">${sinFecha} aplicadas sin fecha no aparecen.</div>`:""}</div>

}

   <div class="panel"><h2>Ofertas útiles por run</h2><p class="small muted" style="margin-top:-4px">Solo las URLs validadas. Útiles = Por aplicar + Evaluar.</p>${data.length?columns(data,{keys,colors:keys.map((_,i)=>pal[i%pal.length]),labels:keys.map(nombre)}):'<div class="muted small">Sin runs cargados.</div>'}</div>
   <div class="grid g2">${b.map(x=>`<div class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3 style="margin:0">${esc(x.nombre)}</h3><span class="pill ${x.estado==="Validada"?"s-int":x.estado==="Descartada"?"s-desc":"s-eval"}">${esc(x.estado)}</span></div>
     <div class="small muted">desde ${fmtD(x.desde)} · ${esc(x.estado.toLowerCase())} el ${fmtD(x.fechaEstado)} · ventana ${esc(x.ventana||"")} · límite ${esc(x.limite||"")}${cnt[x.id]?` · ${cnt[x.id]} ofertas en el tracker`:""}</div>
     <p class="small" style="margin:8px 0 4px">${esc(x.proposito||"")}</p>${x.vigilar?`<p class="small muted" style="margin:0 0 6px">Vigilar: ${esc(x.vigilar)}</p>`:""}
     ${x.url?`<div class="mono" style="word-break:break-all"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.keywords)}</a></div>`:`<div class="mono">${esc(x.keywords||"")}</div>`}</div>`).join("")||'<div class="muted small">Sin búsquedas cargadas.</div>'}</div></div>`;
}

/* ---------- Rúbrica ---------- */
function md(src){
  const lines=String(src||"").split("\n"); let out="",list=0;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,'<code class="mono">$1</code>').replace(/\*(.+?)\*/g,"<i>$1</i>");
  for(const l of lines){
    const m=l.match(/^(\s*)- (.*)/);
    if(m){ const d=m[1].length>=2?2:1; while(list<d){out+="<ul>";list++} while(list>d){out+="</ul>";list--} out+=`<li>${inl(m[2])}</li>`; continue; }
    while(list>0){out+="</ul>";list--}
    if(/^### /.test(l)) out+=`<h3>${inl(l.slice(4))}</h3>`; else if(/^## /.test(l)) out+=`<h2>${inl(l.slice(3))}</h2>`; else if(/^# /.test(l)) out+=`<h1>${inl(l.slice(2))}</h1>`; else if(l.trim()) out+=`<p>${inl(l)}</p>`;
  }
  while(list>0){out+="</ul>";list--}
  return out;
}
let RUB_FILE=null;
function vRub(v){
  const r=S.rubrica||{};
  const texto=r.texto||RUB_FILE;
  if(!texto&&RUB_FILE===null){ RUB_FILE=""; fetch("rubrica.md").then(x=>x.ok?x.text():"").then(t=>{RUB_FILE=t; if(S.view==="rubrica")render();}).catch(()=>{}); }
  if(!texto){ v.innerHTML='<div class="empty">Cargando la rúbrica…</div>'; return; }
  v.innerHTML=`<div class="grid g2" style="grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr)">
   <div class="panel md">${md(texto)}</div>
   <div class="panel"><h2>Versión ${esc(r.version||"")}</h2><p class="small muted">Fuente: documento del proyecto <span class="mono">claude/rubrica-clasificacion.md</span>.</p>
    <h3>Cambios</h3><ul class="small">${(r.cambios||[]).slice().reverse().map(c=>`<li><b>${fmtD(c.fecha)}</b> ${esc(c.texto)}</li>`).join("")}</ul></div></div>`;
}

/* ---------- export ---------- */
function exportRows(){ return [...S.apps].sort((a,b)=>(a.n||0)-(b.n||0)); }
async function save(filename,data){
  if(!DL) return;
  try{ await DL.save({filename,data}); }catch(e){ if(e&&e.code!=="declined"){ const s=$("#subline"); s.textContent="No se pudo exportar ("+(e.code||"error")+")."; } }
}
$("#btnJson").onclick=()=>{ const d=new Date().toISOString().slice(0,10);
  save(`tracker-aplicaciones-${d}.json`,JSON.stringify({exportado:new Date().toISOString(),applications:exportRows(),busquedas:S.busq,runs:S.runs,rubrica:S.rubrica},null,1)); };
$("#btnCsv").onclick=()=>{ const d=new Date().toISOString().slice(0,10);
  const cols=["id","n","empresa","puesto","estado","prioridad","encaje","tipo","modalidad","ubicacion","fuente","link","publicada","fechaAplicacion","senal","fechaSenal","fechaRespuesta","contacto","salario","salMin","salMax","moneda","periodo","stack","brechas","porQue","proximoPaso","motivoDescarte","notas"];
  const cell=v=>{v=Array.isArray(v)?v.join("; "):v??"";v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  save(`tracker-aplicaciones-${d}.csv`,"﻿"+[cols.join(","),...exportRows().map(a=>cols.map(c=>cell(a[c])).join(","))].join("\n")); };

route(); init();
</script>
